services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: groover
      POSTGRES_USER: groover
      POSTGRES_PASSWORD: groover
    ports: ["5432:5432"]
    volumes: ["groover-db:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U groover"]
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    build: ./groover-api
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/groover
      DATABASE_USERNAME: groover
      DATABASE_PASSWORD: groover
      JWT_SECRET: change-this-development-secret-to-at-least-32-bytes
      CORS_ALLOWED_ORIGINS: http://localhost:3001
    ports: ["3000:3000"]
    depends_on:
      db:
        condition: service_healthy
volumes:
  groover-db:
