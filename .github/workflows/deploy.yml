name: Deploy Groover independently
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: groover-production
  cancel-in-progress: false
jobs:
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push api
        uses: docker/build-push-action@v6
        with:
          context: ./groover-api

          push: true
          tags: ghcr.io/ppapigo/groover-api:${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - name: Build and push web
        uses: docker/build-push-action@v6
        with:
          context: ./groover-web

          push: true
          tags: ghcr.io/ppapigo/groover-web:${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
  deploy:
    needs: images
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy Groover without changing shared proxy or database
        uses: appleboy/ssh-action@v1.2.0
        env:
          APP_IMAGE_TAG: ${{ github.sha }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: APP_IMAGE_TAG,GHCR_USER,GHCR_TOKEN
          command_timeout: 30m
          script: |
            set -eu
            PROJECT="$HOME/groover"
            if [ ! -d "$PROJECT/.git" ]; then
              [ ! -e "$PROJECT" ] || { echo "Existing non-git folder: $PROJECT"; exit 1; }
              git clone https://github.com/ppapigo/groover.git "$PROJECT"
            fi
            cd "$PROJECT"
            git fetch origin main
            git merge --ff-only origin/main
            test -s .env.production || { echo "Missing .env.production; refusing deploy"; exit 1; }
            docker network inspect proxy-net >/dev/null
            export APP_IMAGE_TAG
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT
            docker compose --env-file .env.production -f docker-compose.production.yml -f deploy/compose.actions.yml config --quiet
            docker compose --env-file .env.production -f docker-compose.production.yml -f deploy/compose.actions.yml pull api web
            docker compose --env-file .env.production -f docker-compose.production.yml -f deploy/compose.actions.yml up -d --no-build --no-deps --wait api
            docker compose --env-file .env.production -f docker-compose.production.yml -f deploy/compose.actions.yml up -d --no-build --no-deps --wait web
            docker compose --env-file .env.production -f docker-compose.production.yml -f deploy/compose.actions.yml ps
