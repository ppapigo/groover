name: Feed SQL regression
on:
  pull_request:
    paths:
      - "groover-api/src/main/**"
      - "groover-api/src/test/**"
      - ".github/workflows/feed-query-regression.yml"
  workflow_dispatch:
jobs:
  feed-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: groover-api/pom.xml
      - name: Feed SQL query count and existing HTTP contract tests
        working-directory: groover-api
        run: mvn -B -ntp -Dtest=ReviewFeedQueryCountTests,ReviewHttpTests test
      - name: Upload Maven test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: feed-test-reports
          path: groover-api/target/surefire-reports
          if-no-files-found: ignore
