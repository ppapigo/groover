name: Validate deployment shell scripts
on:
  pull_request:
    paths:
      - 'scripts/deploy-guard.sh'
      - '.github/workflows/check-deploy-scripts.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  docker-rollback:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Verify real Docker rollback in isolated fixtures
        env:
          CI_PROJECT_KIND: groover
        run: bash scripts/tests/integration-docker-rollback.sh
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bash syntax
        run: bash -n scripts/deploy-guard.sh
      - name: Mock application deployment and rollback
        run: bash scripts/tests/test-deploy-guard.sh
      - name: Verify required safety controls exist
        shell: bash
        run: |
          set -euo pipefail
          file=scripts/deploy-guard.sh
          grep -Fq -- '--no-deps' "$file"
          grep -Fq -- '--no-build' "$file"
          grep -Fq -- 'rollback()' "$file"
          grep -Fq -- 'compose pull' "$file"
          ! grep -Eq 'docker compose down|docker volume rm|docker system prune' "$file"
