server:
  port: ${PORT:3000}
  servlet:
    context-path: /v1

spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/groover}
    username: ${DATABASE_USERNAME:groover}
    password: ${DATABASE_PASSWORD:groover}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc.time_zone: UTC
  flyway:
    enabled: true

app:
  jwt:
    secret: ${JWT_SECRET:change-this-development-secret-to-at-least-32-bytes}
    access-expiration: 3600000
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3001,http://localhost:3000}
