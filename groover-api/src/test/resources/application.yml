spring:
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  datasource:
    url: jdbc:h2:mem:groover;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    clean-disabled: true
app:
  auth:
    secure-cookies: false
  jwt:
    secret: dGVzdC1vbmx5LXJhbmRvbS1ieXRlcy0wMTIzNDU2Nzg5QUJDREVG
    access-expiration: 3600000
  cors:
    allowed-origins: http://localhost:3001
